name: CI on: push: branches: - main pull_request: branches: - main workflow_dispatch: jobs: test: name: ${{ matrix.os }} — Node ${{ matrix.node }} runs-on: ${{ matrix.os }} strategy: fail-fast: false matrix: os: - windows-latest - ubuntu-latest - macos-latest node: - 22 - 24 steps: # --------------------------------------------------------- # Checkout # --------------------------------------------------------- - name: Checkout repository uses: actions/checkout@v4 # --------------------------------------------------------- # Node.js # --------------------------------------------------------- - name: Setup Node.js ${{ matrix.node }} uses: actions/setup-node@v4 with: node-version: ${{ matrix.node }} cache: npm cache-dependency-path: package-lock.json # --------------------------------------------------------- # Environment information # --------------------------------------------------------- - name: Show environment shell: bash run: | echo "Operating system:" uname -a || true echo "" echo "Node.js:" node --version echo "" echo "npm:" npm --version echo "" echo "Python:" if command -v python3 >/dev/null 2>&1; then python3 --version elif command -v python >/dev/null 2>&1; then python --version else echo "Python not present (optional)" fi # --------------------------------------------------------- # TypeScript # # TypeScript is downloaded temporarily for CI. # It is NOT added to package.json. # --------------------------------------------------------- - name: Typecheck run: | npm exec --yes --package=typescript@5.7 -- tsc --noEmit # --------------------------------------------------------- # Unit + integration tests # --------------------------------------------------------- - name: Unit + integration tests run: npm test # --------------------------------------------------------- # Performance tests # --------------------------------------------------------- - name: Performance smoke budgets run: npm run perf # --------------------------------------------------------- # Python syntax checks # Linux / macOS # --------------------------------------------------------- - name: Python stdlib syntax checks if: runner.os != 'Windows' run: | python3 -m py_compile \ python/worker.py \ python/vision.py \ python/ocr.py \ python/embeddings.py \ python/documents.py # --------------------------------------------------------- # Python syntax checks # Windows # --------------------------------------------------------- - name: Python stdlib syntax checks (Windows) if: runner.os == 'Windows' shell: powershell run: | python -m py_compile ` python/worker.py ` python/vision.py ` python/ocr.py ` python/embeddings.py ` python/documents.py # --------------------------------------------------------- # FluxAgent doctor # --------------------------------------------------------- - name: Doctor smoke run: | node --experimental-strip-types bin/fluxagent.mjs doctor # ============================================================= # RELEASE # ============================================================= release: name: Release pipeline (tag-gated) needs: - test if: startsWith(github.ref, 'refs/tags/v') runs-on: ubuntu-latest steps: # --------------------------------------------------------- # Checkout # --------------------------------------------------------- - name: Checkout repository uses: actions/checkout@v4 # --------------------------------------------------------- # Node.js 24 # --------------------------------------------------------- - name: Setup Node.js uses: actions/setup-node@v4 with: node-version: 24 cache: npm cache-dependency-path: package-lock.json # --------------------------------------------------------- # Show environment # --------------------------------------------------------- - name: Show release environment run: | node --version npm --version # --------------------------------------------------------- # Verify package version # # Example: # # package.json: # "version": "1.2.0" # # Git tag: # v1.2.0 # # Both must match. # --------------------------------------------------------- - name: Verify version matches tag env: GITHUB_REF: ${{ github.ref }} run: | node <<'NODE' const fs = require('fs'); const packageJson = JSON.parse( fs.readFileSync('./package.json', 'utf8') ); const tagVersion = process.env.GITHUB_REF.replace( 'refs/tags/v', '' ); const packageVersion = packageJson.version; console.log(`package.json version: ${packageVersion}`); console.log(`Git tag version: ${tagVersion}`); if (packageVersion !== tagVersion) { console.error( `Version mismatch: package.json ${packageVersion} != tag ${tagVersion}` ); process.exit(1); } console.log('Version check passed.'); NODE # --------------------------------------------------------- # Full tests # --------------------------------------------------------- - name: Run full tests run: npm test # --------------------------------------------------------- # Performance tests # --------------------------------------------------------- - name: Run performance tests run: npm run perf # --------------------------------------------------------- # Doctor # --------------------------------------------------------- - name: Doctor smoke run: | node --experimental-strip-types bin/fluxagent.mjs doctor # --------------------------------------------------------- # Publishing is intentionally manual. # # This workflow DOES NOT: # - npm publish # - create a GitHub Release # - upload packages # # A maintainer must perform publishing manually. # ---------------------------------------------------------
